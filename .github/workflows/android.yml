name: Compilar APK Android

on:
workflow_dispatch:
push:
branches:
- principal

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Instalar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Instalar Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'
      cache: ''

  - name: Preparar proyecto web
    run: |
      mkdir -p www
      cp -r *.html *.png www/ 2>/dev/null || true
      test -f www/index.html || cp www/índice.html www/index.html
      mv paquete.json package.json
      npm install

  - name: Preparar Capacitor
    run: |
      npx cap add android
      npx cap sync android

  - name: Compilar APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Guardar APK
    uses: actions/upload-artifact@v4
    with:
      name: Bear-Arena-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
